name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Theory checks and claims ledger
        run: python tools/verify_claims.py --checks
      - name: CLAIMS.md is up to date
        run: git diff --exit-code CLAIMS.md
